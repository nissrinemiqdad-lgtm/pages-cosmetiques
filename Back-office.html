<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Chez-NUANCE</title>
    <link rel="stylesheet" href="Back-office.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/maquillage.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <header>
        <p class="slogan">Votre beauté, vos règles. Composez votre essentiel.</p>
        <div class="container-fluid d-flex justify-content-between align-items-center p-3 ">
            <span class="logo">NUANCE</span>
            <p class="mb-0">Espace Administration</p>
        </div>
    </header>
    <div class="admin-layout">

        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="configurateur.html">Produits</a></li>
                    <li><a href="checkout.html">Commandes</a></li>
                    <!-- <li><a href="#">Statistiques</a></li> -->
                </ul>
            </nav>
        </aside>

        <main class="container my-5">

            <div class="text-center mb-5">
                <h1 class="fw-bold">Création de produit</h1>
                <p class="text-muted">
                    Ajoutez un nouveau produit à votre catalogue NUANCE.
                </p>
            </div>
            <div class="stepper">

                <div class="step active">
                    <div class="circle">1</div>
                    <span>Informations générales</span>
                </div>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <div class="step">
                    <div class="circle">2</div>
                    <span>Options</span>
                </div>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <div class="step">
                    <div class="circle">3</div>
                    <span>Récapitulatif</span>
                </div>

            </div>
            <div class="card shadow-sm p-4">
                <h2 class="h4 mb-4">Informations générales</h2>

                <form id="form-produit">

                    <div class="mb-3">
                        <label for="nom-produit" class="form-label">
                            Nom du produit
                        </label>
                        <input type="text" id="nom-produit" class="form-control" placeholder="Ex : Rouge à lèvres nude">
                    </div>
                    <div class="mb-3">
                        <label for="type-produit" class="form-label">
                            Type de produit
                        </label>
                        <select id="type-produit" class="form-select">
                            <option value="">Choisir une catégorie</option>
                            <option value="rouge">Rouge à lèvres</option>
                            <option value="fond">Fond de teint</option>
                            <option value="fard">Fard à paupières</option>
                            <option value="mascara">Mascara</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="prix" class="form-label">Prix de base (DH)</label>
                        <input type="number" id="prix" class="form-control" min="0" step="0.01">
                    </div>

                </form>
                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description du produit
                    </label>

                    <textarea id="description" class="form-control" rows="4"
                        placeholder="Décrivez votre produit..."></textarea>
                </div>

                <!-- Image -->
                <div class="mb-3">
                    <label for="image" class="form-label">
                        URL de l'image
                    </label>

                    <input type="url" id="image" class="form-control" placeholder="https://exemple.com/image.jpg">
                </div>

                <!-- Promotion -->
                <div class="form-check mb-3">
                    <input type="checkbox" id="promotion" class="form-check-input">

                    <label for="promotion" class="form-check-label">
                        Activer une promotion
                    </label>
                </div>

                <!-- Informations promotionnelles -->
                <div id="informations-promotion" class="mb-3">

                    <label for="reduction" class="form-label">
                        Pourcentage de réduction (%)
                    </label>

                    <input type="number" id="reduction" class="form-control" min="1" max="100">

                    <label for="date-fin" class="form-label mt-3">
                        Date de fin de promotion
                    </label>

                    <input type="date" id="date-fin" class="form-control">

                </div>
                <div class="d-flex justify-content-between mt-4">

                    <button type="reset" class="btn btn-outline-secondary">
                        Annuler
                    </button>

                    <button type="button" class="btn btn-primary">
                        Suivant →
                    </button>

                </div>
            </div>

        </main>
    </div>
    <script src="Back-office.js"></script>
</body>
